<h1 data-editable="text" data-prop="title"></h1>
<div data-editable="text" data-prop="@content"></div>
<section data-editable="component" data-component="hero" data-prop="hero">
	<h2 data-editable="text" data-prop="heading"></h2>
	<img data-editable="image" data-prop="image" src="/a.png" alt="">
</section>
<ul data-editable="array" data-prop="features">
	<li data-editable="array-item"><span data-editable="text" data-prop="title"></span></li>
	<li data-editable="array-item"><span data-editable="text" data-prop="title"></span></li>
</ul>
<p data-editable="text" data-prop="empty"></p>
<ul data-editable="array" data-prop="@collections[blog]">
	<li data-editable="array-item"><a data-editable="text" data-prop="title"></a></li>
</ul>
<nav data-editable="array" data-prop="@data[nav].links">
	<a data-editable="array-item"><span data-editable="text" data-prop="label"></span></a>
</nav>
<ul data-editable="array" data-prop="@data[team]">
	<li data-editable="array-item"><span data-editable="text" data-prop="name"></span></li>
</ul>
