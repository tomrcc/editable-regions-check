<!doctype html>
<html>
<body>
	<div data-editable="content" data-prop="@content"></div>
	<h1 data-editable="text">No prop</h1>
	<div data-editable="text" data-prop="body" data-type="rich"></div>
	<div data-editable="image" data-prop="hero"></div>
	<img data-editable="image" src="/a.png" alt="">
	<ul data-editable="array"><li data-editable="array-item"></li></ul>
	<li data-editable="array-item">Orphan</li>
	<ul data-editable="array" data-prop="empty"></ul>
	<div data-editable="array" data-prop="columns">
		<div data-editable="array-item"></div>
		<div>Logo</div>
	</div>
	<div data-editable="array" data-prop="blocks" data-id-key="id">
		<div data-editable="array-item" data-id="a"></div>
		<div data-editable="array-item"></div>
	</div>
</body>
</html>
